<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f16"/>
      <stop offset="0.55" stop-color="#0e1520"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6c46a"/>
      <stop offset="1" stop-color="#a8801a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#ink)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>

  <!-- hairline frame -->
  <rect x="34" y="34" width="1532" height="532" fill="none" stroke="#c9a227" stroke-opacity="0.22"/>

