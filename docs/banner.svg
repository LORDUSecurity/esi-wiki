  <text x="104" y="196" fill="#c9a227" font-size="26" letter-spacing="9" font-family="'Trebuchet MS', Verdana, sans-serif">École de Sciences de l'Information · Rabat</text>
  <text x="100" y="316" fill="#f2efe6" font-size="108" font-weight="400" letter-spacing="2">ESI</text>
  <text x="312" y="316" fill="#c9a227" font-size="108" font-weight="400" letter-spacing="2">Wiki</text>
  <rect x="104" y="346" width="150" height="2" fill="url(#gold)"/>
  <text x="104" y="404" fill="#b9c2ce" font-size="31" font-family="'Trebuchet MS', Verdana, sans-serif">A course catalogue, its documents, and an assistant</text>
  <text x="104" y="446" fill="#b9c2ce" font-size="31" font-family="'Trebuchet MS', Verdana, sans-serif">that answers from those documents — not from memory.</text>
  <text x="104" y="512" fill="#6f7f92" font-size="25" letter-spacing="3" font-family="'Trebuchet MS', Verdana, sans-serif">DJANGO 5.2 · REACT 18 · SQLITE FTS5 · 104 MODULES · 945 DOCUMENTS</text>

  <!-- right: retrieval graph -->
