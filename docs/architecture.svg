<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" width="1400" height="620" role="img" aria-label="Architecture du wiki ESI">
  <defs>
    <style>
      .bg   { fill:#05080f }
      .card { fill:#0b111d; stroke:#1d2635; stroke-width:1 }
      .gold { fill:#c9a227 }
      .goldl{ fill:#e3c06a }
      .txt  { fill:#ede7d8; font-family:Georgia,'Times New Roman',serif }
      .sub  { fill:#8b95a8; font-family:'Helvetica Neue',Arial,sans-serif }
      .lbl  { font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; letter-spacing:.18em; text-transform:uppercase }
    </style>
  </defs>

  <rect class="bg" width="1400" height="620"/>

  <!-- title -->
  <text class="txt" x="70" y="86" font-size="30">ESI Wiki — architecture</text>
  <text class="sub" x="70" y="116" font-size="15">Django sert l’API, les PDF et le bundle React. Le assistant répond sans clé par défaut.</text>
  <line x1="70" y1="140" x2="1330" y2="140" stroke="#1d2635"/>

  <!-- browser -->
  <rect class="card" x="70" y="190" width="330" height="250" rx="10"/>
  <rect x="70" y="190" width="330" height="34" rx="10" fill="#111a29"/>
  <circle cx="92" cy="207" r="4" fill="#8b95a8"/><circle cx="108" cy="207" r="4" fill="#8b95a8"/><circle cx="124" cy="207" r="4" fill="#8b95a8"/>
  <text class="lbl" x="95" y="266" fill="#8b95a8">React 18 · Vite · Tailwind</text>
  <rect x="95" y="284" width="240" height="9" rx="4" class="goldl"/>
  <rect x="95" y="302" width="180" height="7" rx="3" fill="#2b3648"/>
  <rect x="95" y="318" width="210" height="7" rx="3" fill="#2b3648"/>
  <rect x="95" y="342" width="120" height="66" rx="6" fill="#111a29" stroke="#1d2635"/>
  <rect x="230" y="342" width="120" height="66" rx="6" fill="#111a29" stroke="#1d2635"/>
  <text class="sub" x="107" y="380" font-size="12">/programmes</text>
  <text class="sub" x="242" y="380" font-size="12">/esihub</text>

  <!-- django -->
  <rect class="card" x="470" y="190" width="360" height="250" rx="10"/>
  <text class="lbl" x="495" y="226" fill="#c9a227">Django 5.2 + DRF — un seul serveur :8000</text>
  <rect x="495" y="244" width="310" height="42" rx="6" fill="#111a29" stroke="#1d2635"/>
  <text class="txt" x="510" y="271" font-size="16">catalog</text>
  <text class="sub" x="590" y="271" font-size="12">modules · ressources · HubCourse</text>
  <rect x="495" y="294" width="310" height="42" rx="6" fill="#111a29" stroke="#1d2635"/>
  <text class="txt" x="510" y="321" font-size="16">core</text>
  <text class="sub" x="590" y="321" font-size="12">filières · FAQ · contact</text>
  <rect x="495" y="344" width="310" height="42" rx="6" fill="#111a29" stroke="#c9a227" stroke-opacity=".55"/>
  <text class="txt" x="510" y="371" font-size="16">aichat</text>
  <text class="sub" x="590" y="371" font-size="12">niveaux du assistant</text>
  <text class="sub" x="495" y="414" font-size="12">/api/* · /courses/*.pdf · /assets · /media</text>

  <!-- database -->
  <g>
    <ellipse cx="750" cy="510" rx="58" ry="16" fill="#111a29" stroke="#1d2635"/>
    <path d="M692 510v34a58 16 0 0 0 116 0v-34" fill="#0b111d" stroke="#1d2635"/>
    <ellipse cx="750" cy="510" rx="58" ry="16" fill="none" stroke="#1d2635"/>
    <text class="sub" x="750" y="534" font-size="12" text-anchor="middle">SQLite</text>
    <text class="sub" x="820" y="534" font-size="12">29 modules · 230 documents (S1–S2)</text>
  </g>

  <!-- assistant tiers -->
  <rect class="card" x="900" y="190" width="430" height="250" rx="10"/>
  <text class="lbl" x="925" y="226" fill="#c9a227">Assistant — 3 niveaux</text>
  <rect x="925" y="244" width="380" height="48" rx="6" fill="#111a29" stroke="#1d2635"/>
  <text class="txt" x="940" y="266" font-size="15">1 · base de données locale</text>
  <text class="sub" x="940" y="284" font-size="12">chiffres et règles lus dans les tables — sans réseau</text>
  <rect x="925" y="300" width="380" height="48" rx="6" fill="#111a29" stroke="#1d2635"/>
  <text class="txt" x="940" y="322" font-size="15">2 · modèles sans clé</text>
  <text class="sub" x="940" y="340" font-size="12">endpoints anonymes, tentés ensuite</text>
  <rect x="925" y="356" width="380" height="48" rx="6" fill="#111a29" stroke="#1d2635"/>
  <text class="txt" x="940" y="378" font-size="15">3 · OpenRouter :free</text>
  <text class="sub" x="940" y="396" font-size="12">seulement si OPENROUTER_API_KEY est posée</text>

  <!-- exe -->
  <rect x="470" y="470" width="200" height="80" rx="8" fill="none" stroke="#1d2635" stroke-dasharray="5 5"/>
  <text class="sub" x="490" y="503" font-size="12">Windows sample</text>
  <text class="txt" x="490" y="527" font-size="15">ESI-Wiki.exe</text>

  <!-- connectors -->
  <path d="M400 315h70" stroke="#c9a227" stroke-opacity=".5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M830 315h70" stroke="#c9a227" stroke-opacity=".5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M650 440v30" stroke="#2b3648" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#c9a227" fill-opacity=".65"/>
    </marker>
  </defs>

  <text class="sub" x="70" y="592" font-size="12">Aucune clé API n’est embarquée dans l’.exe : le partage du sample ne peut donc exposer aucun compte.</text>
</svg>
